# Auth URLs de producción — `supabase config push` actualiza Site URL y Redirect URLs.
# Ver: node scripts/print-supabase-redirects.mjs
#
# SAFETY: this project_id is PRODUCTION (nipqdarduknydqptqzup) for auth URL tooling only.
# CLI link for entitlements / staging migrations must be DrFlow-Staging (gprmsufvhabntbrytwyi).
# Never use this file's project_id as the target for `supabase db push` during entitlements work.
# Preflight: npm run supabase:preflight:staging
# Dry-run:   npm run entitlements:db-push:dry-run
project_id = "nipqdarduknydqptqzup"

[auth]
enabled = true
site_url = "https://drflow.opusorg.com"
additional_redirect_urls = [
  "https://drflow.opusorg.com/**",
  "https://drflow-app-rho.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
