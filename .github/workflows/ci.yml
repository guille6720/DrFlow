name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: TypeScript (zero errors)
        run: npm run typecheck

      - name: ESLint (zero errors)
        run: npm run lint

      - name: Code quality gate
        run: node scripts/code-quality-gate.mjs

      - name: Security gate
        run: node scripts/security-gate.mjs

      - name: Architecture gate
        run: node scripts/architecture-gate.mjs

      - name: Architecture review (strict on PRs)
        if: github.event_name == 'pull_request'
        run: node scripts/architecture-review.mjs --strict --base origin/${{ github.base_ref }}

      - name: Unit tests
        run: npm test

      - name: Coverage gate (core lib ≥90%)
        run: npm run check:coverage

      - name: Critical coverage gate (auth/clinical ≥95%)
        run: npm run check:critical-coverage

      - name: Performance gate
        run: npm run performance:gate

      - name: RLS static audit
        run: npm run test:rls:static

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Smoke health endpoints
        run: |
          npm run start &
          sleep 12
          npm run check:health -- --url=http://127.0.0.1:3000
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  docker:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t drflow-app .

  e2e:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          CI: "true"
